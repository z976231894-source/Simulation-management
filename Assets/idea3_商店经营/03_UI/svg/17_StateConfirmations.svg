<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="States &amp; confirmations"><defs><filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#0E2E24" flood-opacity=".20"/></filter><pattern id="checker" width="48" height="48" patternUnits="userSpaceOnUse"><rect width="48" height="48" fill="#F7F1E4"/><path d="M0 0H24V24H0ZM24 24H48V48H24Z" fill="#BDD6C4"/></pattern><linearGradient id="hero" x1="0" x2="1"><stop offset="0" stop-color="#183E34" stop-opacity=".46"/><stop offset="1" stop-color="#183E34" stop-opacity="0"/></linearGradient></defs><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F7F1E4" opacity="1"/><text x="56" y="60" fill="#617669" font-family="Arial" font-size="15" font-weight="700" text-anchor="start" letter-spacing="2">ONE MORE DINER / INTERACTION STATES</text><text x="56" y="117" fill="#183E34" font-family="Georgia" font-size="48" font-weight="700" text-anchor="start" letter-spacing="0">Clear states. Considered decisions.</text><rect x="56" y="157" width="584" height="270" rx="16" fill="#FFF9ED" opacity="1" stroke="#D7DAC8" stroke-width="1"/><text x="80" y="191" fill="#617669" font-family="Arial" font-size="15" font-weight="700" text-anchor="start" letter-spacing="2">CONFIRMATION</text><text x="80" y="240" fill="#183E34" font-family="Georgia" font-size="29" font-weight="700" text-anchor="start" letter-spacing="0">New Diner?</text><text x="80" y="285" fill="#617669" font-family="Arial" font-size="19" font-weight="400" text-anchor="start" letter-spacing="0">Your current run will be replaced.</text><text x="80" y="315" fill="#617669" font-family="Arial" font-size="19" font-weight="400" text-anchor="start" letter-spacing="0">Export your save first if you want to keep it.</text><rect x="80" y="352" width="254" height="51" rx="12" fill="#CC775F" opacity="1"/><text x="207.0" y="385.5" fill="#F7F1E4" font-family="Arial" font-size="21" font-weight="700" text-anchor="middle" letter-spacing="0">Start New Diner</text><rect x="352" y="352" width="264" height="51" rx="12" fill="#FFF9ED" opacity="1" stroke="#183E34" stroke-width="1"/><text x="484.0" y="385.5" fill="#183E34" font-family="Arial" font-size="21" font-weight="700" text-anchor="middle" letter-spacing="0">Keep Playing</text><rect x="668" y="157" width="584" height="270" rx="16" fill="#FFF9ED" opacity="1" stroke="#D7DAC8" stroke-width="1"/><text x="692" y="191" fill="#617669" font-family="Arial" font-size="15" font-weight="700" text-anchor="start" letter-spacing="2">CONFIRMATION</text><text x="692" y="240" fill="#183E34" font-family="Georgia" font-size="29" font-weight="700" text-anchor="start" letter-spacing="0">Stop accepting customers?</text><text x="692" y="285" fill="#617669" font-family="Arial" font-size="19" font-weight="400" text-anchor="start" letter-spacing="0">No new guests will arrive.</text><text x="692" y="315" fill="#617669" font-family="Arial" font-size="19" font-weight="400" text-anchor="start" letter-spacing="0">Finish everyone already inside.</text><rect x="692" y="352" width="254" height="51" rx="12" fill="#183E34" opacity="1"/><text x="819.0" y="385.5" fill="#F7F1E4" font-family="Arial" font-size="21" font-weight="700" text-anchor="middle" letter-spacing="0">Begin Closing</text><rect x="964" y="352" width="264" height="51" rx="12" fill="#FFF9ED" opacity="1" stroke="#183E34" stroke-width="1"/><text x="1096.0" y="385.5" fill="#183E34" font-family="Arial" font-size="21" font-weight="700" text-anchor="middle" letter-spacing="0">Keep Open</text><rect x="1280" y="157" width="584" height="270" rx="16" fill="#FFF9ED" opacity="1" stroke="#D7DAC8" stroke-width="1"/><text x="1304" y="191" fill="#617669" font-family="Arial" font-size="15" font-weight="700" text-anchor="start" letter-spacing="2">CONFIRMATION</text><text x="1304" y="240" fill="#183E34" font-family="Georgia" font-size="29" font-weight="700" text-anchor="start" letter-spacing="0">Discard this meal?</text><text x="1304" y="285" fill="#617669" font-family="Arial" font-size="19" font-weight="400" text-anchor="start" letter-spacing="0">All used ingredients become waste.</text><text x="1304" y="315" fill="#617669" font-family="Arial" font-size="19" font-weight="400" text-anchor="start" letter-spacing="0">This cannot be undone.</text><rect x="1304" y="352" width="254" height="51" rx="12" fill="#CC775F" opacity="1"/><text x="1431.0" y="385.5" fill="#F7F1E4" font-family="Arial" font-size="21" font-weight="700" text-anchor="middle" letter-spacing="0">Discard Meal</text><rect x="1576" y="352" width="264" height="51" rx="12" fill="#FFF9ED" opacity="1" stroke="#183E34" stroke-width="1"/><text x="1708.0" y="385.5" fill="#183E34" font-family="Arial" font-size="21" font-weight="700" text-anchor="middle" letter-spacing="0">Keep Meal</text><rect x="56" y="459" width="584" height="270" rx="16" fill="#FFF9ED" opacity="1" stroke="#D7DAC8" stroke-width="1"/><text x="80" y="493" fill="#617669" font-family="Arial" font-size="15" font-weight="700" text-anchor="start" letter-spacing="2">CONFIRMATION</text><text x="80" y="542" fill="#183E34" font-family="Georgia" font-size="29" font-weight="700" text-anchor="start" letter-spacing="0">Remove all toppings?</text><text x="80" y="587" fill="#617669" font-family="Arial" font-size="19" font-weight="400" text-anchor="start" letter-spacing="0">Removed toppings become waste.</text><text x="80" y="617" fill="#617669" font-family="Arial" font-size="19" font-weight="400" text-anchor="start" letter-spacing="0">The bun and patty stay on the board.</text><rect x="80" y="654" width="254" height="51" rx="12" fill="#CC775F" opacity="1"/><text x="207.0" y="687.5" fill="#F7F1E4" font-family="Arial" font-size="21" font-weight="700" text-anchor="middle" letter-spacing="0">Remove Toppings</text><rect x="352" y="654" width="264" height="51" rx="12" fill="#FFF9ED" opacity="1" stroke="#183E34" stroke-width="1"/><text x="484.0" y="687.5" fill="#183E34" font-family="Arial" font-size="21" font-weight="700" text-anchor="middle" letter-spacing="0">Keep Toppings</text><rect x="668" y="459" width="584" height="270" rx="16" fill="#FFF9ED" opacity="1" stroke="#D7DAC8" stroke-width="1"/><text x="692" y="493" fill="#617669" font-family="Arial" font-size="15" font-weight="700" text-anchor="start" letter-spacing="2">CONFIRMATION</text><text x="692" y="542" fill="#183E34" font-family="Georgia" font-size="29" font-weight="700" text-anchor="start" letter-spacing="0">Buy Fast Grill for $120?</text><text x="692" y="587" fill="#617669" font-family="Arial" font-size="19" font-weight="400" text-anchor="start" letter-spacing="0">Cash after purchase: $112.</text><text x="692" y="617" fill="#617669" font-family="Arial" font-size="19" font-weight="400" text-anchor="start" letter-spacing="0">Plan tomorrow’s supplies before opening.</text><rect x="692" y="654" width="254" height="51" rx="12" fill="#183E34" opacity="1"/><text x="819.0" y="687.5" fill="#F7F1E4" font-family="Arial" font-size="21" font-weight="700" text-anchor="middle" letter-spacing="0">Buy Upgrade</text><rect x="964" y="654" width="264" height="51" rx="12" fill="#FFF9ED" opacity="1" stroke="#183E34" stroke-width="1"/><text x="1096.0" y="687.5" fill="#183E34" font-family="Arial" font-size="21" font-weight="700" text-anchor="middle" letter-spacing="0">Keep Cash</text><rect x="1280" y="459" width="584" height="270" rx="16" fill="#FFF9ED" opacity="1" stroke="#D7DAC8" stroke-width="1"/><text x="1304" y="493" fill="#617669" font-family="Arial" font-size="15" font-weight="700" text-anchor="start" letter-spacing="2">CONFIRMATION</text><text x="1304" y="542" fill="#183E34" font-family="Georgia" font-size="29" font-weight="700" text-anchor="start" letter-spacing="0">Import this save?</text><text x="1304" y="587" fill="#617669" font-family="Arial" font-size="19" font-weight="400" text-anchor="start" letter-spacing="0">The imported run replaces the current run.</text><text x="1304" y="617" fill="#617669" font-family="Arial" font-size="19" font-weight="400" text-anchor="start" letter-spacing="0">Invalid saves leave your current run intact.</text><rect x="1304" y="654" width="254" height="51" rx="12" fill="#CC775F" opacity="1"/><text x="1431.0" y="687.5" fill="#F7F1E4" font-family="Arial" font-size="21" font-weight="700" text-anchor="middle" letter-spacing="0">Import Save</text><rect x="1576" y="654" width="264" height="51" rx="12" fill="#FFF9ED" opacity="1" stroke="#183E34" stroke-width="1"/><text x="1708.0" y="687.5" fill="#183E34" font-family="Arial" font-size="21" font-weight="700" text-anchor="middle" letter-spacing="0">Cancel</text><text x="56" y="806" fill="#617669" font-family="Arial" font-size="15" font-weight="700" text-anchor="start" letter-spacing="2">LIVE FEEDBACK</text><rect x="56" y="831" width="434" height="156" rx="14" fill="#BDD6C4" opacity="1"/><g transform="translate(76 849) scale(0.546875)" fill="none" stroke="#183E34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M13 33l13 13 26-29"/></g><text x="130" y="875" fill="#617669" font-family="Arial" font-size="15" font-weight="700" text-anchor="start" letter-spacing="2">READY</text><text x="76" y="923" fill="#183E34" font-family="Arial" font-size="21" font-weight="400" text-anchor="start" letter-spacing="0">Cooked at 6s. Take it off.</text><rect x="518" y="831" width="434" height="156" rx="14" fill="#EBC3A8" opacity="1"/><g transform="translate(538 849) scale(0.546875)" fill="none" stroke="#183E34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M32 7L59 55H5ZM32 24v14M32 46h.1"/></g><text x="592" y="875" fill="#617669" font-family="Arial" font-size="15" font-weight="700" text-anchor="start" letter-spacing="2">BURNT</text><text x="538" y="923" fill="#183E34" font-family="Arial" font-size="21" font-weight="400" text-anchor="start" letter-spacing="0">Discard at the dish return.</text><rect x="980" y="831" width="434" height="156" rx="14" fill="#E9EADB" opacity="1"/><g transform="translate(1000 849) scale(0.546875)" fill="none" stroke="#183E34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M32 7L59 55H5ZM32 24v14M32 46h.1"/></g><text x="1054" y="875" fill="#617669" font-family="Arial" font-size="15" font-weight="700" text-anchor="start" letter-spacing="2">WRONG TABLE</text><text x="1000" y="923" fill="#183E34" font-family="Arial" font-size="21" font-weight="400" text-anchor="start" letter-spacing="0">This guest ordered</text><text x="1000" y="951" fill="#183E34" font-family="Arial" font-size="21" font-weight="400" text-anchor="start" letter-spacing="0">a different burger.</text><rect x="1442" y="831" width="434" height="156" rx="14" fill="#E9EADB" opacity="1"/><g transform="translate(1462 849) scale(0.546875)" fill="none" stroke="#183E34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 17l23-10 23 10v31L32 58 9 48ZM9 17l23 10 23-10M32 27v31M21 12l23 10"/></g><text x="1516" y="875" fill="#617669" font-family="Arial" font-size="15" font-weight="700" text-anchor="start" letter-spacing="2">OUT OF STOCK</text><text x="1462" y="923" fill="#183E34" font-family="Arial" font-size="21" font-weight="400" text-anchor="start" letter-spacing="0">No pickles left.</text><text x="1462" y="951" fill="#183E34" font-family="Arial" font-size="21" font-weight="400" text-anchor="start" letter-spacing="0">Review stock or discard meal.</text><text x="56" y="1040" fill="#617669" font-family="Arial" font-size="18" font-weight="400" text-anchor="start" letter-spacing="0">All confirmation screens are proposed UI improvements. Game rules and prices remain unchanged.</text></svg>